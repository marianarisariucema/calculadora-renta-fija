name: Probar API de custodia

on:
  workflow_dispatch: {}

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar Custody Instruments
        env:
          BYMA_CUSTODY_CLIENT_ID: ${{ secrets.BYMA_CUSTODY_CLIENT_ID }}
          BYMA_CUSTODY_CLIENT_SECRET: ${{ secrets.BYMA_CUSTODY_CLIENT_SECRET }}
        run: python explorar_custodia.py
